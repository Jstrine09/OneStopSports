spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/onestopsports
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 30s

external-api:
  football-data:
    base-url: https://api.football-data.org/v4
    api-key: YOUR_API_KEY_HERE  # override in application-local.yml
  nba:
    # ESPN's unofficial public NBA API — no API key required (same provider as NFL)
    base-url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba
    # Standings live on a different ESPN subdomain with richer data
    standings-url: https://site.web.api.espn.com/apis/v2/sports/basketball/nba
    # Career stats endpoint — yet another ESPN path. URL pattern:
    #   {stats-url}/athletes/{espnAthleteId}/stats
    stats-url: https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba
  nfl:
    # ESPN's unofficial public API — no API key required.
    # This is an undocumented but widely-used endpoint. It's stable but not officially supported.
    base-url: https://site.api.espn.com/apis/site/v2/sports/football/nfl
    # Standings use a different ESPN URL path (apis/v2, not apis/site/v2 — same difference as NBA)
    standings-url: https://site.api.espn.com/apis/v2/sports/football/nfl
    # Career stats endpoint — same pattern as NBA but football/nfl path.
    stats-url: https://site.web.api.espn.com/apis/common/v3/sports/football/nfl
  balldontlie:
    # Official REST API for NBA player bios (free tier: /players and /teams only).
    # Rate limit: 5 requests per minute on the free plan.
    base-url: https://api.balldontlie.io/v1
    # API key sent as a plain Authorization header (no "Bearer" prefix).
    # Get yours at https://www.balldontlie.io — override in application-local.yml; never commit the real key.
    api-key: YOUR_BALLDONTLIE_KEY_HERE
  api-football:
    # API-SPORTS direct base URL — sends auth via the x-apisports-key header.
    # If you signed up through RapidAPI instead, swap base-url to
    #   https://api-football-v1.p.rapidapi.com/v3
    # and update ApiFootballService to send x-rapidapi-key + x-rapidapi-host headers.
    base-url: https://v3.football.api-sports.io
    # Free tier: 100 requests/day. Get yours at https://dashboard.api-football.com.
    # Override in application-local.yml; never commit the real key.
    api-key: YOUR_API_FOOTBALL_KEY_HERE

jwt:
  secret: bXlzdXBlcnNlY3JldGtleWZvcmptYXRjaGRheWFwcGxpY2F0aW9u
  expiration-ms: 86400000

# Application-specific settings (our own, not Spring's).
app:
  cors:
    # Website origins allowed to call the API / open the live-scores WebSocket from a browser.
    # Comma-separated Spring "origin patterns" (so "*" wildcards are allowed). Used by both
    # SecurityConfig (REST CORS) and WebSocketConfig (WS handshake). Add a custom domain here
    # later — no Java change needed. Override per environment via the
    # APP_CORS_ALLOWED_ORIGIN_PATTERNS env var (e.g. on Render).
    #   • http://localhost:*                 — any local dev port (Vite runs on 3000)
    #   • https://one-stop-sports*.vercel.app — the Vercel site + its preview/alias URLs
    allowed-origin-patterns: http://localhost:*,https://one-stop-sports*.vercel.app

server:
  port: 8081

# Swagger UI is served at http://localhost:8081/swagger-ui/index.html
# The raw OpenAPI JSON spec is at http://localhost:8081/v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html          # /swagger-ui.html redirects to /swagger-ui/index.html
    operations-sorter: alpha        # Sort endpoints alphabetically so they're easy to scan
    tags-sorter: alpha              # Sort controller groups alphabetically too
  api-docs:
    path: /v3/api-docs              # Where the raw JSON spec lives (used by external tools like Postman)
